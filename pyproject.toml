[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cashia-api"
version = "0.1.0"
description = "Cashia FastAPI application"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Juan Manuel Ahuactzin", email = "juan.manuel.ahuactzin@gmail.com" }
]
dependencies = [
    "fastapi==0.136.0",
    "uvicorn[standard]==0.44.0",
    "pydantic",
    "python-multipart==0.0.26",
    "boto3==1.42.83",
    "pandas==2.2.3",
    "numpy==2.2.6",
    "cashia-core==1.1.0",
    "cashia-model==1.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
